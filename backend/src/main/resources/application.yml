spring:
  application:
    name: belay
  jackson:
    # Champs null omis du JSON : colle aux types générés (body?: string, jamais null)
    default-property-inclusion: non-null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/belay}
    username: ${DB_USERNAME:belay}
    password: ${DB_PASSWORD:belay}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    redis:
      namespace: "belay:session"
    timeout: 12h
  servlet:
    multipart:
      max-file-size: 5MB
      # 4 images de 5 Mo max par post + marge
      max-request-size: 25MB

belay:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:belay-media}
    region: ${S3_REGION:us-east-1}

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: BELAY_SESSION
        http-only: true
        same-site: lax
        # true en production (HTTPS) — surchargé par variable d'environnement
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
